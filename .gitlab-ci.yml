image: registry.spring26b.secoder.net/tool/deployer

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - export BUILD_IMAGE_NAME=$CI_REGISTRY_IMAGE
    - export BUILD_IMAGE_TAG=$CI_COMMIT_REF_SLUG
    - export BUILD_IMAGE_USERNAME=$CI_REGISTRY_USER
    - export BUILD_IMAGE_PASSWORD=$CI_REGISTRY_PASSWORD
    - deployer build

.test:
  image: python:3.12-slim
  stage: test
  # 🌟 核心修复：启动临时的数据库服务供测试使用
  services:
    - name: postgres:15-alpine
      alias: test-db  # 我们给这个临时数据库起个内部域名叫 test-db
    # 👇 新增：召唤一个临时的 Redis 服务器
    - name: redis:7-alpine
      alias: test-redis
  variables:
    # 🌟 初始化临时数据库的账号密码
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    POSTGRES_DB: test_db
    JWT_SECRET_KEY: "test_secret_for_cicd_only"
    # 🌟 强制将代码里的地址指向这些临时容器
    DATABASE_URL: "postgresql://test_user:test_password@test-db:5432/test_db"
    # 👇 新增：强制将代码里的 Redis 地址指向临时容器
    REDIS_URL: "redis://test-redis:6379/0"
  before_script:
    - apt-get update && apt-get install -y curl tar
    - pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt coverage pytest pycodestyle pylint

unit-test:
  extends: .test
  script:
    # 🌟 拆除辅助轮：移除了 || true
    # 现在只要单测报错，流水线就会红，防止带着 Bug 的代码上线
    - coverage run -m pytest --junit-xml=xunit-reports/xunit-result.xml
    - ret=$?
    - coverage xml -o coverage-reports/coverage.xml
    - coverage report
    - exit $ret
  after_script:
    - SUFFIX=$RANDOM
    - echo "开始下载 Sonar Scanner..."
    - curl "http://api.spring26b.secoder.net/static/sonar-scanner.tar.gz" -L -o "/tmp/sonar-$SUFFIX.tar.gz"
    - echo "下载完成，开始解压..."
    - tar -xf "/tmp/sonar-$SUFFIX.tar.gz" -C /opt
    - echo "开始执行代码扫描..."
    - /opt/sonar-scanner/bin/sonar-scanner

style-test:
  extends: .test
  allow_failure: true # 依然允许风格不完美时不阻断流水线
  script:
    # 完美通过一号检查员 (pycodestyle)
    - pycodestyle --max-line-length=120 .
    - PYCODESTYLE_RET=$?
    # 🌟 核心修改：给二号检查员 (pylint) 戴上紧箍咒，只报致命错误，忽略 C, R, W
    - pylint --max-line-length=120 --disable=C,R,W .
    - PYLINT_RET=$?
    - if [ $PYCODESTYLE_RET \> 0 ]; then exit $PYCODESTYLE_RET; fi;
    - exit $PYLINT_RET

deploy:
  stage: deploy
  script:
    - deployer dyno replace $CI_PROJECT_NAME "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" "$REGISTRY_USER" "$REGISTRY_PWD"
  only:
    - feat/cicd
    - dev